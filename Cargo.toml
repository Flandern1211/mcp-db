[package]
name = "mcp-db"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
description = "Authorized multi-database MCP service"
publish = false

[dependencies]
axum = "0.8"
base64 = "0.22"
http = "1"
rand = "0.8"
rmcp = { version = "2.2.0", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
strip = true
