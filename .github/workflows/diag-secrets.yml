name: diag-secrets
on: push
jobs:
  diag:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Report secret lengths only
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            value="${!name}"
            printf '%s len=%s\n' "$name" "${#value}"
          done
          printf 'path_pattern_test: '
          if [[ $DEPLOY_PATH =~ ^/[A-Za-z0-9._/-]+$ ]]; then echo match; else echo no-match; fi
          printf 'user_pattern_test: '
          if [[ $DEPLOY_USER =~ ^[a-zA-Z_][a-zA-Z0-9._-]*$ ]]; then echo match; else echo no-match; fi
          printf 'host_pattern_test: '
          if [[ $DEPLOY_HOST =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]; then echo match; else echo no-match; fi
