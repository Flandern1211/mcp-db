name: cd

# CD：交付与部署。验证工作（CI）在 ci.yml；
# 本工作流只把已验证的镜像发布为不可变摘要并部署到生产主机，
# 只有 main 推送才运行。
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish image to GHCR
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == github.sha && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mcp-db-image
          path: ${{ runner.temp }}/image
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Push the tested image and record its manifest digest
        id: push
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="sha-$GITHUB_SHA"
          docker load --input "$RUNNER_TEMP/image/mcp-db-image.tar"
          docker tag mcp-db:ci "$image:$tag"
          printf '%s\n' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # Take the manifest digest from this push, not from an anonymous
          # lookup or a subsequent lookup by mutable tag. RepoDigests is set by
          # the push itself and does not depend on the CLI's human-readable
          # progress output, which differs between Docker versions.
          docker push "$image:$tag"
          digest=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image:$tag" |
            awk -v prefix="$image@" 'index($0, prefix) == 1 { print substr($0, length(prefix) + 1) }' |
            head -n 1)
          if [[ ! $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf '::error::Push did not record one canonical manifest digest; inspect the registry before retrying.\n'
            exit 1
          fi
          printf 'digest=%s@%s\n' "$image" "$digest" >> "$GITHUB_OUTPUT"
          printf 'Published %s@%s\n' "$image" "$digest"

  deploy:
    name: Deploy digest to production
    needs: publish
    if: success()
    runs-on: ubuntu-24.04
    # pull alone may take up to 900s; plus lock 60s, compose wait 240s and SSH/probe overhead.
    timeout-minutes: 25
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Repository administrators must restrict production to the main branch
      # and put the DEPLOY_* secrets in that environment, not at repo scope.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # The host keeps no deploy configuration of its own: deploy/ is synced
      # from this commit on every run, so the running unit always matches the
      # deployed source. Only keys/ and data/ stay host-owned, and rsync never
      # addresses them.
      - name: Sync deploy files and run deploy.sh
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          IMAGE_REF: ${{ needs.publish.outputs.digest }}
        run: |
          if [[ ! $DEPLOY_USER =~ ^[a-zA-Z_][a-zA-Z0-9._-]*$ ||
                ! $DEPLOY_HOST =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ||
                ! $DEPLOY_PATH =~ ^/[A-Za-z0-9._/-]+$ ||
                -z $DEPLOY_SSH_KEY || -z $DEPLOY_KNOWN_HOSTS ]]; then
            printf '::error::Production SSH settings are missing or invalid.\n'
            exit 1
          fi
          if [[ ${IMAGE_REF%@*} != "ghcr.io/${GITHUB_REPOSITORY,,}" ||
                ! ${IMAGE_REF##*@} =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf '::error::Expected an immutable image digest for this repository.\n'
            exit 1
          fi
          umask 077
          ssh_files=$(mktemp -d "$RUNNER_TEMP/mcpdb-ssh.XXXXXXXX")
          trap 'rm -f -- "$ssh_files/key" "$ssh_files/known_hosts"; rmdir -- "$ssh_files"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_files/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_files/known_hosts"
          unset DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS

          # A queued or manually re-run job must not knowingly replace a newer main.
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ $tip != "$GITHUB_SHA" ]]; then
            printf '::error::This run no longer targets the main tip; nothing sent to the host.\n'
            exit 1
          fi
          if ! ssh-keygen -F "$DEPLOY_HOST" -f "$ssh_files/known_hosts" >/dev/null; then
            printf '::error::DEPLOY_KNOWN_HOSTS has no pinned entry for DEPLOY_HOST.\n'
            exit 1
          fi

          ssh_opts=(-F /dev/null -i "$ssh_files/key"
            -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none
            -o StrictHostKeyChecking=yes -o UpdateHostKeys=no
            -o UserKnownHostsFile="$ssh_files/known_hosts" -o GlobalKnownHostsFile=/dev/null
            -o ClearAllForwardings=yes -o ConnectTimeout=20)
          rsync -rlpt -e "ssh ${ssh_opts[*]}" \
            deploy/docker-compose.yml deploy/deploy.sh deploy/bootstrap.sh deploy/Caddyfile \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"
          ssh "${ssh_opts[@]}" -T -n \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod 0755 '${DEPLOY_PATH}/deploy.sh' '${DEPLOY_PATH}/bootstrap.sh' &&
             chmod 0644 '${DEPLOY_PATH}/docker-compose.yml' '${DEPLOY_PATH}/Caddyfile' &&
             bash '${DEPLOY_PATH}/deploy.sh' '${IMAGE_REF}'"